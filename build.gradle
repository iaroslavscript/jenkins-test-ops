plugins {
    id 'groovy'
    id 'maven-publish'
}

group = 'io.github.iaroslavscript'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Standard Groovy library from Gradle distribution
    implementation localGroovy()

    // Using the bundle from the gradle/lib.versions.toml file
    testImplementation libs.bundles.testing
}

sourceSets {
    main {
        groovy { srcDirs = ['src/main/groovy'] }
    }
    test {
        groovy { srcDirs = ['src/test/groovy'] }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
